<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Digital Painting</title>
    <link rel="stylesheet" href="style/style.css" />
    <style>
      /* Style for the transition video to overlay the container */
      #transition-video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: none; /* Hidden by default */
        z-index: 10; /* Ensure it overlays other elements */
      }
    </style>
  </head>
  <body>
    <div class="container" id="interactive-container">
      <img id="background" src="src/BG.jpg" class="background" />
      <div class="image-container">
        <img id="base-body" src="src/body.png" alt="Base Body" class="image" />
        <img id="body" alt="Body" class="image overlay" />
        <img id="head" alt="Head" class="image overlay" />
        <!-- Transition Video Element -->
        <video id="transition-body-video" class="image overlay"></video>
        <video id="transition-head-video" class="image overlay"></video>
      </div>

      <!-- Floating window -->
      <div class="floating-buttons" id="button-container">
        <div class="collapse-button" id="collapse-button">
          <img
            src="src/menu-button.png"
            alt="Collapse"
            onclick="showButtonGroup()"
          />
        </div>
        <div id="button-group-container" class="button-group-container hidden">
          <!-- Menu Button -->
          <div class="toggle-button">
            <img class="toggle-button logo" src="src/button-transform.png" />
            <img
              id="toggle-img-all"
              class="toggle-button switch"
              src="src/button-switch-off.png"
              onclick="toggleAllButtonHandler(this);"
            />
          </div>
          <div class="toggle-button">
            <img class="toggle-button logo" src="src/button-headgear.png" />
            <img
              id="toggle-img-head"
              class="toggle-button switch"
              src="src/button-switch-off.png"
              onclick="toggleButtonHandler(this, 'head')"
            />
          </div>
          <div class="toggle-button">
            <img class="toggle-button logo" src="src/button-clothes.png" />
            <img
              id="toggle-img-body"
              class="toggle-button switch"
              src="src/button-switch-off.png"
              onclick="toggleButtonHandler(this, 'body')"
            />
          </div>
          <div class="toggle-button">
            <img class="toggle-button logo" src="src/button-aura.png" />
            <img
              class="toggle-button switch"
              src="src/button-switch-off.png"
              onclick="toggleButtonHandler(this, 'aura')"
            />
          </div>
          <div class="toggle-button">
            <input
              class="toggle-button slider"
              type="range"
              id="slider"
              min="0"
              max="250"
              value="125"
              oninput="moveBackground(this.value)"
            />
          </div>
          
          <div class="middle-bottom-div">
            <img
              onclick="downloadImage()"
              class="toggle-button logo"
              src="src/button-download.png"
            />
          </div>
          <!-- Menu Button -->
        </div>
        <div
          id="button-group-container-background"
          class="menu-background hidden"
        ></div>
      </div>

      <!-- Floating window close -->
    </div>

    <!-- Include html2canvas Library -->
    <script src="js/html2canvas.min.js"></script>
    <!-- Include Custom Script -->
    <script src="js/script.js"></script>
  </body>
</html>
