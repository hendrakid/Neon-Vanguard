<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Digital Painting</title>
    <link rel="stylesheet" href="style/style.css" />
    <style>
      .loading {
        transition: opacity 0.3s ease, transform 0.3s ease; /* Add smooth transition */
        position: relative;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgb(0, 0, 0);
        object-fit: contain; /* Preserve aspect ratio */
        z-index: 10; /* Ensure it overlays other elements */
      }
    </style>
  </head>
  <body>
    <img id="loading" src="src/body.png" alt="Base Body" class="loading" />
    <div class="container" id="container">
      <img id="background" src="src/background.jpg" class="background" />
      <div class="image-container">
        <img id="base-body" class="image overlay" style="z-index: 1" />
        <img id="body" class="image overlay" style="z-index: 2" />
        <img id="head" class="image overlay" style="z-index: 3" />
        <!-- Transition Video Element -->
        <video
          id="transition-body-video"
          class="image overlay"
          style="z-index: 12"
        ></video>
        <video
          id="transition-head-video"
          class="image overlay"
          style="z-index: 13"
        ></video>
        <video
          id="aura-video"
          class="image overlay"
          style="z-index: 14"
          loop
        ></video>
      </div>

      <!-- Floating window -->
      <div class="floating-buttons" id="button-container">
        <div class="collapse-button" id="collapse-button">
          <img
            src="src/UI/menu-button.png"
            alt="Collapse"
            onclick="showButtonGroup()"
          />
        </div>
        <div id="button-group-container" class="button-group-container hidden">
          <!-- Menu Button -->
          <div class="toggle-button">
            <img class="toggle-button logo" src="src/UI/button-transform.png" />
            <img
              id="toggle-img-all"
              class="toggle-button switch"
              src="src/UI/button-switch-off.png"
              onclick="toggleAllButtonHandler(this);"
            />
          </div>
          <div class="toggle-button">
            <img class="toggle-button logo" src="src/UI/button-headgear.png" />
            <img
              id="toggle-img-head"
              class="toggle-button switch"
              src="src/UI/button-switch-off.png"
              onclick="toggleButtonHandler(this, 'head')"
            />
          </div>
          <div class="toggle-button">
            <img class="toggle-button logo" src="src/UI/button-clothes.png" />
            <img
              id="toggle-img-body"
              class="toggle-button switch"
              src="src/UI/button-switch-off.png"
              onclick="toggleButtonHandler(this, 'body')"
            />
          </div>
          <div class="toggle-button">
            <img class="toggle-button logo" src="src/UI/button-aura.png" />
            <img
              class="toggle-button switch"
              src="src/UI/button-switch-off.png"
              onclick="playAura(this, 'aura')"
            />
          </div>
          <div class="toggle-button">
            <input
              class="toggle-button slider"
              type="range"
              id="slider"
              min="0"
              max="100"
              value="50"
              oninput="moveBackground(this.value)"
            />
          </div>

          <div class="middle-bottom-div">
            <img
              onclick="downloadImage()"
              class="toggle-button logo"
              src="src/UI/button-download.png"
            />
          </div>
          <!-- Menu Button -->
        </div>
        <div
          id="button-group-container-background"
          class="menu-background hidden"
        ></div>
      </div>
      <!-- Floating window close -->
    </div>

    <!-- Include html2canvas Library -->
    <script src="js/html2canvas.min.js"></script>
    <!-- Include Custom Script -->
    <script src="js/script.js"></script>
  </body>
</html>
