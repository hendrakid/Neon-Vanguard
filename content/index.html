<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Vanguard</title>
    <style crossorigin="">
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .background {
        position: fixed;
        top: 0;
        left: 0;
        width: auto;
        height: 100%;
        object-fit: cover;
        object-position: center;
        z-index: -1;
      }

      .container {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .image-container {
        position: relative;
        width: auto;
        height: 100%;
        object-position: center;
      }

      .image {
        width: auto;
        height: 100%;
        object-fit: contain;
      }

      .overlay {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        right: auto;
      }
      .opacity-ease-02 {
        transition: opacity 0.2s ease;
      }
      .opacity-ease-03 {
        transition: opacity 0.3s ease;
      }

      .floating-buttons {
        position: absolute;
        top: 2vh;
        right: 2vh;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        z-index: 999;
      }

      .button-group-container {
        width: 50vw;
        height: 50vw;
        max-width: 2000px;
        max-height: 2000px;
        min-width: 100px;
        min-height: 100px;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        border-radius: 10px;
        padding-top: 15%;
        padding-left: 5%;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        display: flex;
        flex-direction: column;
        gap: 1vw;
        overflow: hidden;
        z-index: 1000;
      }

      .button-group-container {
        position: relative;
      }

      .menu-background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
      }

      .menu-background-frame {
        transition: opacity 0.3s ease, transform 0.3s ease;
        position: absolute;
        display: flex;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
      }

      .toggle-button {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 1.5vw;
      }

      .toggle-button.logo {
        width: 30vw;
        height: auto;
      }

      .toggle-button.switch {
        transition: opacity 0.3s ease, transform 0.3s ease;
        width: auto;
        height: 5vw;
        margin-right: 10px;
        cursor: pointer;
      }

      .toggle-button.slider {
        width: 100vw;
        height: 1vw;
        margin-right: 10px;
        cursor: pointer;
      }

      .toggle-button.switch.off {
        opacity: 1;
      }

      .toggle-button.switch.on {
        opacity: 1;
        transform: scale(1.1);
      }

      .middle-bottom-div {
        position: absolute;
        bottom: -5px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        padding: 5px 10px;
        border-radius: 5px;
        text-align: center;
        cursor: pointer;
      }

      .collapse-button img {
        width: 5vh;
        height: auto;
        cursor: pointer;
      }

      .collapse-button img:hover {
        opacity: 0.8;
      }

      .collapse-button button {
        padding: 1.5vh 3vh;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 0.5vh;
        cursor: pointer;
        font-size: 2vh;
      }

      .collapse-button button:hover {
        background-color: #0056b3;
      }

      .hidden {
        display: none;
      }

      .loading {
        transition: opacity 1s ease, transform 0.3s ease;
        position: absolute;
        display: flex;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgb(0, 0, 0);
        object-fit: contain;
        z-index: 1001;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <video id="loading-video" class="loading" loop muted></video>
    <div class="container" id="container">
      <img id="background" class="background" crossorigin="anonymous" />
      <div class="image-container">
        <img id="base-body" class="image overlay" crossorigin="anonymous" />
        <img
          id="body-armor"
          class="image overlay opacity-ease-02"
          crossorigin="anonymous"
        />
        <img
          id="head-armor"
          class="image overlay opacity-ease-02"
          crossorigin="anonymous"
        />
        <img id="body-clothes" class="image overlay" crossorigin="anonymous" />
        <img id="head-clothes" class="image overlay" crossorigin="anonymous" />
        <video
          id="aura-video"
          class="image overlay"
          muted
          crossorigin="anonymous"
        ></video>
        <video
          id="transition-body-video"
          class="image overlay opacity-ease-03"
          muted
        ></video>
        <video
          id="transition-head-video"
          class="image overlay opacity-ease-03"
          muted
        ></video>
      </div>
      <div class="floating-buttons" id="button-container">
        <div class="collapse-button" id="collapse-button">
          <img id="menu-toggle" alt="Collapse" />
        </div>
        <div id="button-group-container" class="button-group-container hidden">
          <!-- Menu Button -->
          <div class="toggle-button">
            <img id="buttonTransform" class="toggle-button logo" />
            <img id="toggle-img-all" class="toggle-button switch off" />
          </div>
          <div class="toggle-button">
            <img id="buttonHeadgear" class="toggle-button logo" />
            <img id="toggle-img-head" class="toggle-button switch off" />
          </div>
          <div class="toggle-button">
            <img id="buttonClothes" class="toggle-button logo" />
            <img id="toggle-img-body" class="toggle-button switch off" />
          </div>
          <div class="toggle-button">
            <img id="buttonAura" class="toggle-button logo" />
            <img id="toggle-img-aura" class="toggle-button switch off" />
          </div>
          <div class="toggle-button">
            <input
              class="toggle-button slider"
              type="range"
              id="slider"
              min="0"
              max="100"
              value="50"
            />
          </div>
          <div class="middle-bottom-div">
            <img id="buttonDownload" class="toggle-button logo" />
          </div>
          <img id="menu-box" class="menu-background-frame" />
          <!-- Menu Button -->
        </div>
        <div
          id="button-group-container-background"
          class="menu-background hidden"
        ></div>
      </div>
    </div>
    <script type="module" crossorigin="">
      const buttonDownload = document.getElementById("buttonDownload");
      const buttonTransform = document.getElementById("buttonTransform");
      const buttonHeadgear = document.getElementById("buttonHeadgear");
      const buttonClothes = document.getElementById("buttonClothes");
      const buttonAura = document.getElementById("buttonAura");
      const menuBox = document.getElementById("menu-box");
      const menuToggle = document.getElementById("menu-toggle");

      const slider = document.getElementById("slider");

      const allToggle = document.getElementById("toggle-img-all");
      const headToggle = document.getElementById("toggle-img-head");
      const bodyToggle = document.getElementById("toggle-img-body");
      const auraToggle = document.getElementById("toggle-img-aura");

      const bodyBase = document.getElementById("base-body");
      const bodyArmor = document.getElementById("body-armor");
      const headArmor = document.getElementById("head-armor");
      const bodyClothes = document.getElementById("body-clothes");
      const headClothes = document.getElementById("head-clothes");

      const aura = document.getElementById("aura-video");
      const transitionHead = document.getElementById("transition-head-video");
      const transitionBody = document.getElementById("transition-body-video");

      const container = document.getElementById("container");
      const loading = document.getElementById("loading-video");
      const background = document.getElementById("background");

      const buttonGroupContainer = document.getElementById(
        "button-group-container"
      );
      const buttonGroupContainerBackground = document.getElementById(
        "button-group-container-background"
      );
      const collapseButton = document.getElementById("collapse-button");

      let isAllActive = false;
      let isHeadActive = false;
      let isBodyActive = false;
      let isAuraActive = false;

      const contentImagePaths = {
        bodyBase: "./src/body.webp",
        background: "./src/background.webp",
        bodyClothes: "./src/body-clothes.webp",
        headClothes: "./src/head-clothes.webp",
        bodyArmor: "./src/body-armor.webp",
        headArmor: "./src/head-armor.webp",
      };

      const UIImagePaths = {
        buttonAura: "./src/UI/button-aura.webp",
        buttonClothes: "./src/UI/button-clothes.webp",
        buttonDownload: "./src/UI/button-download.webp",
        buttonHeadgear: "./src/UI/button-headgear.webp",
        buttonTransform: "./src/UI/button-transform.webp",
        menuBox: "./src/UI/menu-box.webp",
        menuToggle: "./src/UI/menu-button.webp",
      };

      const UIImagePathsBase64 = {
        buttonSwitchOn: "./src/UI/button-switch-on.webp",
        buttonSwitchOff: "./src/UI/button-switch-off.webp",
      };

      const videoPaths = {
        body: "./src/transition_body.webm",
        head: "./src/transition_head.webm",
        aura: "./src/aura.webm",
      };

      // Function to load an image and convert it to Base64
      const loadImageAsBase64 = (src) => {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.crossOrigin = "Anonymous"; // Ensure cross-origin images can be converted to Base64
          img.onload = () => {
            // Create a canvas to convert the image to Base64
            const canvas = document.createElement("canvas");
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0);
            const dataURL = canvas.toDataURL("image/webp"); // Convert to Base64
            resolve(dataURL);
          };
          img.onerror = () => reject(new Error(`Failed to load image: ${src}`));
          img.src = src;
        });
      };

      const cache = {};

      window.onload = function () {
        console.log("start preload " + new Date().toLocaleTimeString());
        loading.style.opacity = 1;
        loading.src = "./src/UI/loading.webm";
        loading.onloadedmetadata = function () {
          loading.play();

          Promise.all(
            Object.entries(UIImagePathsBase64).map(([key, path]) =>
              loadImageAsBase64(path).then((base64) => {
                cache[key] = base64; // Store Base64 string in cache
              })
            )
          )
            .then(() => {
              allToggle.src = cache.buttonSwitchOff;
              headToggle.src = cache.buttonSwitchOff;
              bodyToggle.src = cache.buttonSwitchOff;
              auraToggle.src = cache.buttonSwitchOff;
            })
            .catch((error) => console.error(error.message));

          const loadImage = (imageElement, src) => {
            return new Promise((resolve, reject) => {
              imageElement.onload = () => resolve(imageElement);
              imageElement.onerror = () =>
                reject(new Error(`Failed to load image: ${src}`));
              imageElement.src = src;
            });
          };
          const loadVideo = (videoElement, src) => {
            return new Promise((resolve, reject) => {
              videoElement.onloadeddata = () => {
                videoElement.play();
                videoElement.onended = function () {
                  videoElement.currentTime = 0;
                  videoElement.style.opacity = 0;
                  videoElement.pause();
                  resolve(videoElement);
                };
              };
              videoElement.onerror = () =>
                reject(new Error(`Failed to load video: ${src}`));
              videoElement.src = src;
            });
          };

          // Create promises for all assets
          const promises = [
            loadImage(bodyBase, contentImagePaths.bodyBase),
            loadImage(bodyArmor, contentImagePaths.bodyArmor),
            loadImage(headArmor, contentImagePaths.headArmor),
            loadImage(bodyClothes, contentImagePaths.bodyClothes),
            loadImage(headClothes, contentImagePaths.headClothes),
            loadImage(background, contentImagePaths.background),

            loadVideo(aura, videoPaths.aura),
            loadVideo(transitionHead, videoPaths.head),
            loadVideo(transitionBody, videoPaths.body),

            loadImage(buttonAura, UIImagePaths.buttonAura),
            loadImage(buttonClothes, UIImagePaths.buttonClothes),
            loadImage(buttonDownload, UIImagePaths.buttonDownload),
            loadImage(buttonHeadgear, UIImagePaths.buttonHeadgear),
            loadImage(buttonTransform, UIImagePaths.buttonTransform),
            loadImage(menuBox, UIImagePaths.menuBox),
            loadImage(menuToggle, UIImagePaths.menuToggle),
          ];
          // Wait for all assets to load
          Promise.all(promises)
            .then(() => {
              console.log("finish preload " + new Date().toLocaleTimeString());

              headArmor.style.opacity = 0;
              bodyArmor.style.opacity = 0;

              aura.loop = true;
              aura.style.opacity = 0;

              transitionHead.style.opacity = 0;
              transitionBody.style.opacity = 0;

              background.style.opacity = 1;
              bodyBase.style.opacity = 1;
              bodyClothes.style.opacity = 1;
              headClothes.style.opacity = 1;

              moveBackground(50);
              loading.style.opacity = 0;
            })
            .catch((error) => {
              console.error(error.message);
            });
        };
      };

      function setActiveToggle(element, activated) {
        // Use a small timeout to allow the transition to take effect before changing the image source
        setTimeout(() => {
          if (activated) {
            element.src = cache.buttonSwitchOn;
            element.classList.remove("off");
            element.classList.add("on");
          } else {
            element.src = cache.buttonSwitchOff;
            element.classList.remove("on");
            element.classList.add("off");
          }
        }, 100);
      }
      function playTransition(attribute, activated) {
        hideButtonGroup();

        let videoElement = null;
        if (attribute === "head") {
          videoElement = transitionHead;
        } else if (attribute === "body") {
          videoElement = transitionBody;
        }

        if (!activated) {
          videoElement.pause();
          videoElement.currentTime = videoElement.duration;
          videoElement.style.opacity = 1;
          // Start at the end

          let frame = 0;
          const stepBackward = () => {
            if (videoElement.currentTime > 0) {
              videoElement.currentTime = Math.max(
                videoElement.currentTime - 0.075,
                0
              );
              // Move back one frame (approximately 33ms for 30fps)
              videoElement.requestVideoFrameCallback(() => {
                stepBackward();
                // Call next frame
                if (frame === 1) setImage(attribute, activated);
                frame++;
              });
            } else {
              videoElement.pause();
              setTimeout(() => {
                videoElement.style.opacity = 0;
              }, 50);
              // Hide the video element
            }
          };
          stepBackward();
          // Start the reverse playback loop
        } else {
          videoElement.style.opacity = 1;
          videoElement.play();

          videoElement.onended = function () {
            setImage(attribute, activated);
            videoElement.pause();
            setTimeout(() => {
              videoElement.style.opacity = 0;
            }, 50);
          };

          // Handle video playback errors
          videoElement.onerror = function () {
            console.error(`Error playing transition video: ${videoSrc}`);
            videoElement.style.opacity = 0;
          };
        }
      }
      function setImage(attribute, activated) {
        if (attribute === "head") {
          if (activated) {
            headArmor.style.opacity = 1;
            headClothes.style.opacity = 0;
          } else {
            headArmor.style.opacity = 0;
            headClothes.style.opacity = 1;
          }
        } else if (attribute === "body") {
          if (activated) {
            bodyArmor.style.opacity = 1;
            bodyClothes.style.opacity = 0;
          } else {
            bodyArmor.style.opacity = 0;
            bodyClothes.style.opacity = 1;
          }
        }
      }

      function hideButtonGroup() {
        buttonGroupContainer.classList.add("hidden");
        buttonGroupContainerBackground.classList.add("hidden");
        collapseButton.classList.remove("hidden");

        // Remove the event listener
        document.removeEventListener("click", hideButtonGroupOnClickOutside);
      }
      function hideButtonGroupOnClickOutside(event) {
        if (
          !buttonGroupContainer.contains(event.target) &&
          !collapseButton.contains(event.target)
        ) {
          hideButtonGroup();
        }
      }

      function showButtonGroup() {
        buttonGroupContainer.classList.remove("hidden");
        buttonGroupContainerBackground.classList.remove("hidden");
        collapseButton.classList.add("hidden");
        document.addEventListener("click", hideButtonGroupOnClickOutside);
      }
      function toggleAllButtonHandler(element) {
        const currentSrc = element.src;
        var activated = element.classList.contains("off");
        isAllActive = activated;
        setActiveToggle(element, activated);

        toggleButtonHandler(headToggle, "head", isAllActive);
        toggleButtonHandler(bodyToggle, "body", isAllActive);
      }

      function toggleButtonHandler(element, attribute, forceCondition = null) {
        const currentSrc = element.src;
        var activated = element.classList.contains("off");

        if (forceCondition !== null) {
          if (attribute === "head") if (isHeadActive === forceCondition) return;
          if (attribute === "body") if (isBodyActive === forceCondition) return;

          activated = forceCondition;
        }

        if (attribute === "head") isHeadActive = activated;
        if (attribute === "body") isBodyActive = activated;

        setActiveToggle(element, activated);

        if (forceCondition === null) {
          if (isHeadActive && isBodyActive && !isAllActive) {
            setActiveToggle(allToggle, true);
            isAllActive = true;
          } else if ((!isHeadActive || !isBodyActive) && isAllActive) {
            setActiveToggle(allToggle, false);
            isAllActive = false;
          }
        }

        playTransition(attribute, activated);
      }

      function playAura(element) {
        var activated = element.classList.contains("off");
        setActiveToggle(element, activated);

        isAuraActive = activated;
        if (activated) {
          aura.style.opacity = 1;
          aura.play();
        } else {
          aura.style.opacity = 0;
          aura.pause();
        }
        hideButtonGroup();
      }
      function moveBackground(value) {
        const bgWidth = background.offsetWidth;
        const viewportWidth = window.innerWidth;
        const maxMovement = (bgWidth - viewportWidth) / 2;
        const mappedValue =
          (value / slider.max) * 2 * maxMovement - maxMovement;
        const clampedValue =
          Math.max(-maxMovement, Math.min(mappedValue, maxMovement)) -
          maxMovement;

        background.style.transform = `translateX(${clampedValue}px)`;
        return clampedValue;
      }

      function downloadImage(offsetX) {
        let canvasWidth = 1500,
          canvasHeight = 1500,
          canvas = document.createElement("canvas");
        canvas.height = canvasWidth;
        canvas.width = canvasHeight;
        let context = canvas.getContext("2d");

        let bgAspectRatio = background.width / background.height;
        let canvasAspectRatio = canvas.width / canvas.height;

        let bgDrawWidth, bgDrawHeight, bgOffsetX, bgOffsetY;

        if (bgAspectRatio > canvasAspectRatio) {
          // Background is wider than the canvas
          bgDrawWidth = canvas.height * bgAspectRatio;
          bgDrawHeight = canvas.height;
          bgOffsetX = (canvas.width - bgDrawWidth) / 2;
          bgOffsetY = 0;
        } else {
          // Background is taller than the canvas
          bgDrawWidth = canvas.width;
          bgDrawHeight = canvas.width / bgAspectRatio;
          bgOffsetX = 0;
          bgOffsetY = (canvas.height - bgDrawHeight) / 2;
        }

        // Adjust the offsetX for scaling
        let scaledOffsetX = offsetX * (bgDrawWidth / background.offsetWidth);

        // Draw the background image with the adjusted x-offset
        context.drawImage(
          background,
          scaledOffsetX,
          bgOffsetY,
          bgDrawWidth,
          bgDrawHeight
        );

        context.drawImage(bodyBase, 0, 0, canvasWidth, canvasHeight);

        if (isBodyActive)
          context.drawImage(bodyArmor, 0, 0, canvasWidth, canvasHeight);
        else context.drawImage(bodyClothes, 0, 0, canvasWidth, canvasHeight);

        if (isHeadActive)
          context.drawImage(headArmor, 0, 0, canvasWidth, canvasHeight);
        else context.drawImage(headClothes, 0, 0, canvasWidth, canvasHeight);

        if (isAuraActive)
          context.drawImage(aura, 0, 0, canvasWidth, canvasHeight);

        let link = document.createElement("a");
        link.href = canvas.toDataURL("image/png");
        link.download = "Neon-Vanguard.png";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
      // use html2canvas
      // function downloadImage() {
      //   hideButtonGroup();
      //   buttonContainer.style.opacity = 0;
      //   html2canvas(container, {
      //     allowTaint: true,
      //     useCORS: true,
      //   }).then(function (canvas) {
      //     const ctx = canvas.getContext("2d");
      //     const aura = document.getElementById("aura-video");
      //     ctx.drawImage(aura, 0, 0, canvas.width, canvas.height);
      //     const link = document.createElement("a");
      //     link.href = canvas.toDataURL("image/png");
      //     link.download = "Neon-Vanguard.png";
      //     link.click();
      //     buttonContainer.style.opacity = 1;
      //   });
      // }

      menuToggle.addEventListener("click", function () {
        showButtonGroup();
      });

      allToggle.addEventListener("click", function () {
        toggleAllButtonHandler(this);
      });
      headToggle.addEventListener("click", function () {
        toggleButtonHandler(this, "head");
      });
      bodyToggle.addEventListener("click", function () {
        toggleButtonHandler(this, "body");
      });
      auraToggle.addEventListener("click", function () {
        playAura(this);
      });
      slider.addEventListener("input", (e) => {
        moveBackground(e.target.value);
      });

      buttonDownload.addEventListener("click", () => {
        let offsetX = moveBackground(slider.value); // Get the x-offset
        downloadImage(offsetX);
      });
    </script>
  </body>
</html>
