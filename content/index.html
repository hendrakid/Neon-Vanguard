<!DOCTYPE html>
<html lang="en">

    <style crossorigin="">
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .background {
        position: fixed;
        top: 0;
        left: 0;
        width: auto;
        height: 100%;
        object-fit: cover;
        object-position: center;
        z-index: -1;
      }

      .container {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .image-container {
        position: relative;
        width: auto;
        height: 100%;
        object-position: center;
      }

      .image {
        width: auto;
        height: 100%;
        object-fit: contain;
      }

      .overlay {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        max-width: "100%";
        right: auto;
      }

      .floating-buttons {
        position: absolute;
        top: 2vh;
        right: 2vh;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        z-index: 999;
      }

      .button-group-container {
        width: 50vw;
        height: 50vw;
        max-width: 2000px;
        max-height: 2000px;
        min-width: 100px;
        min-height: 100px;
        background-image: url("./src/UI/menu-box.webp");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        border-radius: 10px;
        padding-top: 15%;
        padding-left: 5%;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        display: flex;
        flex-direction: column;
        gap: 1vw;
        overflow: hidden;
        z-index: 1000;
      }

      .button-group-container {
        position: relative;
      }

      .menu-background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
      }

      .toggle-button {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 1.5vw;
      }

      .toggle-button.logo {
        width: 30vw;
        height: auto;
      }

      .toggle-button.switch {
        transition: opacity 0.3s ease, transform 0.3s ease;
        width: auto;
        height: 5vw;
        margin-right: 10px;
        cursor: pointer;
      }

      .toggle-button.slider {
        width: 100vw;
        height: 1vw;
        margin-right: 10px;
        cursor: pointer;
      }

      .toggle-button.switch.off {
        opacity: 0;
      }

      .toggle-button.switch.on {
        opacity: 1;
        transform: scale(1.1);
      }

      .middle-bottom-div {
        position: absolute;
        bottom: -5px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        padding: 5px 10px;
        border-radius: 5px;
        text-align: center;
        cursor: pointer;
      }

      .collapse-button img {
        width: 5vh;
        height: auto;
        cursor: pointer;
      }

      .collapse-button img:hover {
        opacity: 0.8;
      }

      .collapse-button button {
        padding: 1.5vh 3vh;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 0.5vh;
        cursor: pointer;
        font-size: 2vh;
      }

      .collapse-button button:hover {
        background-color: #0056b3;
      }

      .hidden {
        display: none;
      }

      .loading {
        transition: opacity 0.3s ease, transform 0.3s ease;
        position: absolute;
        display: flex;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgb(0, 0, 0);
        object-fit: contain;
        z-index: 10;
      }
    </style>

      // Function to create a promise for image loading
      const loadImage = (src) => {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error(`Failed to load image: ${src}`));
          img.src = src;
        });
      };

      // Function to create a promise for video loading
      const loadVideo = (videoElement, src) => {
        return new Promise((resolve, reject) => {
          videoElement.onloadeddata = () => resolve(videoElement);
          videoElement.onerror = () =>
            reject(new Error(`Failed to load video: ${src}`));
          videoElement.src = src;
        });
      };

      // Create promises for all assets

              background.src = loadedBackground.src;

              aura.src = loadedAura.src;
              transitionHead.src = loadedTransitionHead.src;
              transitionBody.src = loadedTransitionBody.src;

              // Perform additional actions here

              loading.style.opacity = 0;
              headArmor.style.opacity = 0;
              bodyArmor.style.opacity = 0;
              aura.style.opacity = 0;
              transitionHead.style.opacity = 0;
              transitionBody.style.opacity = 0;

              background.style.opacity = 1;
              bodyBase.style.opacity = 1;
              bodyClothes.style.opacity = 1;
              headClothes.style.opacity = 1;
            }
          )
          .catch((error) => {
            console.error(error.message);
          });
      };

      function setActiveToggle(element, activated) {
        element.classList.remove("on");
        // Remove 'on' class
        element.classList.add("off");
        // Remove 'off' class

        // Use a small timeout to allow the transition to take effect before changing the image source
        setTimeout(() => {
          if (activated) {
            element.src = "./src/UI/button-switch-on.webp";
            // Change to 'ON' state
            element.classList.remove("off");
            element.classList.add("on");
          } else {
            element.src = "./src/UI/button-switch-off.webp";
            // Change to 'OFF' state
            element.classList.remove("on");
            // Remove 'on' class
            element.classList.remove("off");
            // Remove 'off' class
          }
        }, 100);
      }
      function playTransition(attribute, activated, hasTransition, callback) {
        hideButtonGroup();

        if (!hasTransition) {
          setImage(attribute, value);
          callback();
          return;
        }

        const videoElement = document.getElementById(
          "transition-" + attribute + "-video"
        );
        const videoSrc = "./src/transition_" + attribute + ".webm";

        if (videoElement.src !== videoSrc) videoElement.src = videoSrc;
        videoElement.style.display = "block";
        // Show the video element

        videoElement.onloadedmetadata = function () {
          if (!activated) {
            videoElement.pause();
            videoElement.currentTime = videoElement.duration;
            // Start at the end

            let frame = 0;
            const stepBackward = () => {
              if (videoElement.currentTime > 0) {
                videoElement.currentTime = Math.max(
                  videoElement.currentTime - 0.075,
                  0
                );
                // Move back one frame (approximately 33ms for 30fps)
                videoElement.requestVideoFrameCallback(() => {
                  stepBackward();
                  // Call next frame
                  if (frame === 1) setImage(attribute, activated);
                  frame++;
                });
              } else {
                videoElement.pause();
                setTimeout(() => {
                  videoElement.style.display = "none";
                }, 50);
                // Hide the video element
                callback();
                // Execute callback after reverse playback
              }
            };
            stepBackward();
            // Start the reverse playback loop
          } else {
            videoElement.play();

            // When the video ends, hide it and execute the callback
            videoElement.onended = function () {
              setImage(attribute, activated);
              videoElement.pause();
              setTimeout(() => {
                videoElement.style.display = "none";
              }, 50);

              callback();
            };

            // Handle video playback errors
            videoElement.onerror = function () {
              console.error(`Error playing transition video: ${videoSrc}`);
              videoElement.style.display = "none";
              callback();
              // Proceed even if the video fails
            };
          }
        };

        // Handle cases where the video fails to load metadata
        videoElement.onerror = function () {
          console.error(`Failed to load video metadata: ${videoSrc}`);
          videoElement.style.display = "none";
          callback();
          // Proceed even if the video fails
        };
      }
      function setImage(attribute, activated) {
        const element = document.getElementById(attribute);

        if (activated) {
          element.src = "./src/" + attribute + "-armor.webp";
          element.style.display = "block";
          // Show image
        } else {
          element.src = "./src/" + attribute + "-clothes.webp";
          element.style.display = "block";
          // Show image
        }
      }

      function hideButtonGroup() {
        buttonGroupContainer.classList.add("hidden");
        buttonGroupContainerBackground.classList.add("hidden");
        collapseButton.classList.remove("hidden");

        // Remove the event listener
        document.removeEventListener("click", hideButtonGroupOnClickOutside);
      }
      function hideButtonGroupOnClickOutside(event) {
        if (
          !buttonGroupContainer.contains(event.target) &&
          !collapseButton.contains(event.target)
        ) {
          hideButtonGroup();
        }
      }

      function showButtonGroup() {
        buttonGroupContainer.classList.remove("hidden");
        buttonGroupContainerBackground.classList.remove("hidden");
        collapseButton.classList.add("hidden");
        document.addEventListener("click", hideButtonGroupOnClickOutside);
      }
      function toggleAllButtonHandler(element) {
        const currentSrc = element.src;
        element.classList.remove("on");
        element.classList.add("off");
        var activated = currentSrc.includes("button-switch-off.webp");
        isAllActive = activated;

        setActiveToggle(element, activated);

        toggleButtonHandler(headToggle, "head", isAllActive);
        toggleButtonHandler(bodyToggle, "body", isAllActive);
      }
      function toggleButtonHandler(element, attribute, forceCondition = null) {
        const currentSrc = element.src;
        var activated = currentSrc.includes("button-switch-off.webp");

        if (forceCondition !== null) {
          if (attribute === "head") if (isHeadActive === forceCondition) return;
          if (attribute === "body") if (isBodyActive === forceCondition) return;

          activated = forceCondition;
        }

        if (attribute === "head") isHeadActive = activated;
        if (attribute === "body") isBodyActive = activated;

        setActiveToggle(element, activated);

        if (forceCondition === null) {
          if (isHeadActive && isBodyActive && !isAllActive) {
            setActiveToggle(allToggle, true);
          } else if ((!isHeadActive || !isBodyActive) && isAllActive) {
            setActiveToggle(allToggle, false);
          }
        }

        playTransition(attribute, activated, true, () => {
          console.log("no call back");
          isTransitioning = false;
        });
      }
      function playAura(element) {
        const currentSrc = element.src;
        var activated = currentSrc.includes("button-switch-off.webp");
        setActiveToggle(element, activated);

        isAuraActive = activated;
        if (activated) {
          aura.src = videoPaths.aura;
          aura.style.display = "block";
          aura.onloadedmetadata = function () {
            aura.play();
          };
        } else {
          aura.style.display = "none";
        }
        hideButtonGroup();
      }
      function moveBackground(value) {
        const bgWidth = background.offsetWidth;
        const viewportWidth = window.innerWidth;
        const maxMovement = (bgWidth - viewportWidth) / 2;
        const mappedValue =
          (value / slider.max) * 2 * maxMovement - maxMovement;
        const clampedValue =
          Math.max(-maxMovement, Math.min(mappedValue, maxMovement)) -
          maxMovement;

        background.style.transform = `translateX(${clampedValue}px)`;
        return clampedValue;
      }

      function downloadImage(offsetX) {
        let canvasWidth = 1500,
          canvasHeight = 1500,
          canvas = document.createElement("canvas");
        canvas.height = canvasWidth;
        canvas.width = canvasHeight;
        let context = canvas.getContext("2d");

        let bgAspectRatio = background.width / background.height;
        let canvasAspectRatio = canvas.width / canvas.height;

        let bgDrawWidth, bgDrawHeight, bgOffsetX, bgOffsetY;

        if (bgAspectRatio > canvasAspectRatio) {
          // Background is wider than the canvas
          bgDrawWidth = canvas.height * bgAspectRatio;
          bgDrawHeight = canvas.height;
          bgOffsetX = (canvas.width - bgDrawWidth) / 2;
          bgOffsetY = 0;
        } else {
          // Background is taller than the canvas
          bgDrawWidth = canvas.width;
          bgDrawHeight = canvas.width / bgAspectRatio;
          bgOffsetX = 0;
          bgOffsetY = (canvas.height - bgDrawHeight) / 2;
        }

        // Adjust the offsetX for scaling
        let scaledOffsetX = offsetX * (bgDrawWidth / background.offsetWidth);

        // Draw the background image with the adjusted x-offset
        context.drawImage(
          background,
          scaledOffsetX,
          bgOffsetY,
          bgDrawWidth,
          bgDrawHeight
        );

        context.drawImage(bodyBase, 0, 0, canvasWidth, canvasHeight);
        context.drawImage(body, 0, 0, canvasWidth, canvasHeight);
        context.drawImage(head, 0, 0, canvasWidth, canvasHeight);
        if (isAuraActive)
          context.drawImage(aura, 0, 0, canvasWidth, canvasHeight);

        let link = document.createElement("a");
        link.href = canvas.toDataURL("image/png");
        link.download = "Neon-Vanguard.png";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
